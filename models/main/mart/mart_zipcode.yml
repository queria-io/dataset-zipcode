version: 2

models:
  - name: mart_zipcode
    description: 日本郵便が公開する全国の郵便番号データ。郵便番号（新・旧）と都道府県・市区町村・町域の名称（漢字・カナ）に加え、地方公共団体コードや複数郵便番号・丁目の有無などのフラグを収録する。
    access: public
    config:
      contract:
        enforced: true
    columns:
      - name: lg_code
        data_type: VARCHAR
      - name: old_zipcode
        data_type: VARCHAR
      - name: zipcode
        data_type: VARCHAR
      - name: prefecture_kana
        data_type: VARCHAR
      - name: city_kana
        data_type: VARCHAR
      - name: town_kana
        data_type: VARCHAR
      - name: prefecture
        data_type: VARCHAR
      - name: city
        data_type: VARCHAR
      - name: town
        data_type: VARCHAR
      - name: has_multiple_zipcodes
        data_type: INTEGER
      - name: has_koaza_banchi
        data_type: INTEGER
      - name: has_chome
        data_type: INTEGER
      - name: has_multiple_towns
        data_type: INTEGER
      - name: update_status
        data_type: INTEGER
      - name: update_reason
        data_type: INTEGER
